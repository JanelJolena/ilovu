<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Thư Tình Dễ Thương</title>
  <style>
    /* Reset & nền cơ bản */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #ffe4ec 0%, #ffc0cb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
      padding: 16px;
      /* Hỗ trợ iPhone tai thỏ */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Container chính - kích thước linh hoạt */
    .letter-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .letter-container:active {
      transform: scale(0.98);
    }

    /* Phong bì thư */
    .envelope {
      position: relative;
      width: 100%;
      aspect-ratio: 1.6 / 1;
      background: #fef9e7;
      border-radius: 18px;
      box-shadow: 0 20px 35px -8px rgba(255, 105, 135, 0.35),
                  0 10px 15px -6px rgba(0, 0, 0, 0.1),
                  inset 0 0 0 2px rgba(255, 255, 255, 0.7);
      transition: box-shadow 0.4s ease, transform 0.3s ease;
      transform-origin: center;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Hiệu ứng bóng mượt */
      will-change: transform, box-shadow;
    }

    /* Viền phong bì giả lập */
    .envelope::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 2px dashed #ffb6c1;
      border-radius: 12px;
      opacity: 0.6;
      pointer-events: none;
    }

    /* Nắp phong bì (flap) - sẽ mở ra */
    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 70%;
      background: #ffeef2;
      border-radius: 18px 18px 50% 50% / 18px 18px 30% 30%;
      clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
      transform-origin: top;
      transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: inset 0 -4px 8px rgba(255, 150, 170, 0.2);
      z-index: 3;
      pointer-events: none;
      will-change: transform;
    }

    /* Trái tim trên nắp */
    .heart-on-flap {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(28px, 10vw, 48px);
      filter: drop-shadow(0 4px 6px rgba(255, 80, 120, 0.3));
      animation: pulse 1.8s infinite ease-in-out;
      z-index: 5;
      pointer-events: none;
    }

    /* Lá thư bên trong */
    .letter-paper {
      position: absolute;
      bottom: 8%;
      left: 6%;
      width: 88%;
      height: 75%;
      background: #fffaf0;
      border-radius: 16px;
      box-shadow: 0 6px 14px rgba(255, 120, 140, 0.2),
                  inset 0 0 0 1px #fff0f3;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      transform: translateY(0%);
      z-index: 2;
      overflow: hidden;
      will-change: transform, opacity;
      border: 1px solid #ffd9e2;
    }

    /* Nội dung chữ "Anh yêu Em" */
    .love-text {
      font-size: clamp(32px, 12vw, 58px);
      font-weight: 800;
      color: #d43f5e;
      text-shadow: 0 2px 10px rgba(255, 100, 130, 0.4);
      letter-spacing: 2px;
      transform: scale(0.8);
      opacity: 0;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
      font-family: 'Quicksand', 'Segoe UI', sans-serif;
      text-align: center;
      line-height: 1.2;
      padding: 0 10px;
      word-break: keep-all;
      white-space: nowrap;
    }

    /* Khi phong bì mở */
    .envelope.open .flap {
      transform: rotateX(180deg);
      border-radius: 18px 18px 50% 50% / 18px 18px 20% 20%;
      box-shadow: inset 0 8px 12px rgba(255, 150, 170, 0.3);
    }

    .envelope.open .letter-paper {
      transform: translateY(-30%) scale(1.02);
      box-shadow: 0 14px 28px rgba(255, 105, 135, 0.4), inset 0 0 0 2px #ffe2e9;
      transition-delay: 0.15s;
      z-index: 4;
    }

    .envelope.open .love-text {
      transform: scale(1);
      opacity: 1;
      transition-delay: 0.35s;
    }

    /* Ẩn trái tim khi mở để đỡ rối mắt */
    .envelope.open .heart-on-flap {
      opacity: 0;
      transition: opacity 0.25s;
    }

    /* Hướng dẫn nhỏ */
    .hint {
      margin-top: 28px;
      font-size: 15px;
      font-weight: 500;
      color: #b3546b;
      background: rgba(255, 255, 255, 0.6);
      padding: 8px 22px;
      border-radius: 40px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 4px 10px rgba(255, 140, 160, 0.2);
      transition: opacity 0.4s ease, transform 0.4s ease;
      animation: float 2.8s infinite ease-in-out;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      will-change: transform;
    }

    /* Khi đã mở, ẩn hint */
    .letter-container.opened .hint {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }

    /* Animations */
    @keyframes pulse {
      0% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.15); }
      100% { transform: translateX(-50%) scale(1); }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }

    /* Hiệu ứng tim rơi nhẹ (trang trí) */
    .floating-heart {
      position: fixed;
      top: -10vh;
      font-size: 24px;
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
      animation: fall linear infinite;
      user-select: none;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0.1; }
    }

    /* Tối ưu cho màn hình nhỏ iPhone 13 (390x844) */
    @media (max-width: 400px) {
      .envelope {
        aspect-ratio: 1.55 / 1;
      }
      .love-text {
        font-size: clamp(30px, 11vw, 48px);
      }
      .hint {
        font-size: 13px;
        padding: 7px 18px;
        margin-top: 24px;
      }
    }

    /* Đảm bảo chữ không bị tràn trên màn hình dọc */
    @media (max-aspect-ratio: 1/1) {
      .love-text {
        font-size: clamp(28px, 10vw, 44px);
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>

  <!-- Tim bay trang trí (tạo bởi JS) -->
  
  <div class="letter-container" id="letterContainer">
    <div class="envelope" id="envelope">
      <!-- Nắp thư -->
      <div class="flap"></div>
      <!-- Trái tim trên nắp -->
      <div class="heart-on-flap">❤️</div>
      <!-- Lá thư bên trong -->
      <div class="letter-paper">
        <div class="love-text" id="loveText">Anh yêu Em</div>
      </div>
    </div>
    <div class="hint" id="hint">💌 Bấm vào phong bì để mở thư</div>
  </div>

  <script>
    (function() {
      const container = document.getElementById('letterContainer');
      const envelope = document.getElementById('envelope');
      const hint = document.getElementById('hint');
      
      let isOpen = false;

      // Hàm mở thư
      function openLetter() {
        if (isOpen) return;
        isOpen = true;
        
        // Thêm class open cho phong bì
        envelope.classList.add('open');
        // Thêm class opened cho container (ẩn hint)
        container.classList.add('opened');
        
        // Rung nhẹ trên điện thoại (nếu được hỗ trợ)
        if (navigator.vibrate) {
          navigator.vibrate(20);
        }
      }

      // Hàm đóng thư (nếu muốn bấm lần nữa để đóng)
      function closeLetter() {
        if (!isOpen) return;
        isOpen = false;
        envelope.classList.remove('open');
        container.classList.remove('opened');
      }

      // Toggle khi click / touch
      function toggleLetter(e) {
        e.preventDefault(); // tránh double tap zoom trên mobile
        if (!isOpen) {
          openLetter();
        } else {
          // Nếu muốn bấm lần nữa để đóng, mở comment dòng dưới:
          // closeLetter();
          // Hiện tại mình giữ nguyên mở, không đóng để tránh nhầm lẫn.
          // Nhưng để người dùng có thể chơi lại, có thể nhấn giữ? Thôi thì mở là mở luôn.
        }
      }

      // Gắn sự kiện
      container.addEventListener('click', toggleLetter);
      // Hỗ trợ touch mượt hơn, tránh delay
      container.addEventListener('touchstart', function(e) {
        // Không preventDefault ở đây để không chặn click, nhưng click sẽ chạy sau
        // Chỉ cần đảm bảo không bị double
      }, { passive: true });

      // Ngăn chặn double-tap zoom trên iOS
      let lastTouchEnd = 0;
      container.addEventListener('touchend', function(e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

      // Tạo hiệu ứng tim bay lả tả (trang trí)
      function createFloatingHearts() {
        const heartSymbols = ['❤️', '💖', '💗', '💓', '🌸', '✨', '💕'];
        const count = 12; // số lượng tim
        
        for (let i = 0; i < count; i++) {
          const heart = document.createElement('div');
          heart.className = 'floating-heart';
          heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
          
          // Vị trí ngẫu nhiên
          const left = Math.random() * 100; // vw
          const delay = Math.random() * 8; // giây
          const duration = 8 + Math.random() * 7; // 8-15 giây
          const size = 18 + Math.random() * 24; // 18-42px
          
          heart.style.left = left + 'vw';
          heart.style.animationDelay = delay + 's';
          heart.style.animationDuration = duration + 's';
          heart.style.fontSize = size + 'px';
          heart.style.opacity = 0.3 + Math.random() * 0.3;
          
          // Random vị trí bắt đầu
          heart.style.top = '-10vh';
          
          document.body.appendChild(heart);
        }
      }

      // Khởi tạo tim bay
      createFloatingHearts();

      // Đảm bảo khi load xong, nếu có class open từ trước thì xử lý (không cần)
      // Nhưng khởi tạo trạng thái ban đầu: đóng
      
      // Thêm hiệu ứng nhấn nhá nhẹ cho phong bì trước khi mở (không cần thiết)
      // Nhưng có thể thêm animation nhẹ cho hint
    })();
  </script>

  <!-- Thêm font Quicksand từ Google Fonts để dễ thương hơn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
</body>
</html>
